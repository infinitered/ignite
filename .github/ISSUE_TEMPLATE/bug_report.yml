name: Bug report
description: Report a defect in the app
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Before filing, please confirm:
          * You're on the latest commit on the default branch (`git pull` then retry).
          * There isn't already an open issue for the same bug.
          * `pnpm before-pr` is green on a clean checkout.

  - type: textarea
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect instead? Include reproduction steps.
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      description: From `package.json` `version` field, or the build number from the app.
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS device
        - iOS simulator
        - Android device
        - Android emulator
        - Web
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Output of `pnpm doctor` and `node -v && pnpm -v`.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots / video
      description: Attach if visual.
